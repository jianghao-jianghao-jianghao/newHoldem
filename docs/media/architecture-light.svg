  <rect x="266" y="139" width="60" height="24" rx="12" fill="#FFFFFF" stroke="#9A6E1C" stroke-width="1"/>
  <text x="296" y="154.5" text-anchor="middle" fill="#9A6E1C" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600">WS /ws</text>
  <text x="296" y="177" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="10">状态广播</text>

