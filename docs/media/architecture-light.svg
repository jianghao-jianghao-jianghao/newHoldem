  <text x="82" y="194" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600">打击特效与声效</text>
  <text x="82" y="214" fill="#475569" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5">Canvas 2D · Web Audio</text>

