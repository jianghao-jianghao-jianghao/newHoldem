  <path d="M 492 198 L 516 198 Q 522 198 522 192 L 522 140 Q 522 134 528 134 L 558 134" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrWire)"/>
  <path d="M 492 198 L 516 198 Q 522 198 522 204 L 522 272 Q 522 278 528 278 L 558 278" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrWire)"/>
