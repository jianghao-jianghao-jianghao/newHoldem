    <path d="M1 3.5 L1 12.5 C1 13.9 3.7 15 7 15 C10.3 15 13 13.9 13 12.5 L13 3.5"/>
    <path d="M1 8 C1 9.4 3.7 10.5 7 10.5 C10.3 10.5 13 9.4 13 8"/>
