  <text x="76" y="268" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">全押光刃 · 筹码喷泉 · 分面值物理声效与爵士乐</text>

  <rect x="62" y="288" width="246" height="44" rx="8" fill="#101618" stroke="#1F2B27"/>
  <text x="76" y="308" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600">React 19 + Recharts 交互台</text>
  <text x="76" y="324" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">大厅 · 账簿抽屉 · 30 枚勋章 · 快捷键引擎</text>

  <text x="185" y="362" text-anchor="middle" fill="#6F7D77" font-family="ui-monospace, Consolas, monospace" font-size="11">Vite 8 · Tailwind CSS v4</text>

  <!-- Connector 1 -> 2 -->
  <line x1="336" y1="210" x2="394" y2="210" stroke="#D4A853" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrowGold)" marker-start="url(#arrowGold)"/>
  <text x="365" y="198" text-anchor="middle" fill="#D4A853" font-family="ui-monospace, Consolas, monospace" font-size="10">WS /ws</text>
  <line x1="336" y1="268" x2="394" y2="268" stroke="#3AA778" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreen)"/>
  <text x="365" y="256" text-anchor="middle" fill="#7CE0B3" font-family="ui-monospace, Consolas, monospace" font-size="10">REST API</text>

