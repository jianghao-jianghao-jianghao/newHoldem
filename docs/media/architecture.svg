  <text x="76" y="212" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">丝绒牌桌 · 筹码物理 · 双视角 · 2D 自动回退</text>

  <rect x="62" y="232" width="246" height="44" rx="8" fill="#101618" stroke="#1F2B27"/>
