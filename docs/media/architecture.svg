  <rect x="402" y="98" width="320" height="280" rx="14" fill="url(#cardFill)" stroke="#24302C" stroke-width="1.2"/>
  <rect x="402" y="98" width="320" height="3" rx="1.5" fill="#1E6B4B"/>
  <text x="426" y="130" fill="#7CE0B3" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">02 · REALTIME CORE</text>
