<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#143225" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#0B0F10" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#080A0B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A853" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1E6B4B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4A853" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13191B"/>
      <stop offset="100%" stop-color="#0D1113"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#F2D28B"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#D4A853" fill-opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3AA778" fill-opacity="0.85"/>
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="1118" height="418" rx="18" fill="url(#bgGlow)" stroke="url(#goldBorder)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="44" fill="#D4A853" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4">SYSTEM ARCHITECTURE</text>
  <text x="40" y="70" fill="#F4EFE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">同源单端口实时联机架构</text>
  <rect x="894" y="34" width="186" height="28" rx="14" fill="#13261E" stroke="#1E6B4B" stroke-width="1"/>
  <text x="987" y="52" text-anchor="middle" fill="#7CE0B3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">Node.js 22 · Docker Ready</text>

  <!-- Column 1: Client -->
  <rect x="40" y="98" width="290" height="280" rx="14" fill="url(#cardFill)" stroke="#24302C" stroke-width="1.2"/>
  <rect x="40" y="98" width="290" height="3" rx="1.5" fill="url(#accentGold)"/>
  <text x="64" y="130" fill="#D4A853" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">01 · CLIENT</text>
  <text x="64" y="155" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600">浏览器 3D / 2D 牌桌</text>

  <rect x="62" y="176" width="246" height="44" rx="8" fill="#101618" stroke="#1F2B27"/>
