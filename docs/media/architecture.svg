  <text x="438" y="212" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">密码学洗牌 · 多级边池 · 死钱守恒 · Rule 47</text>

  <rect x="424" y="232" width="276" height="44" rx="8" fill="#101815" stroke="#1E4B38"/>
  <text x="438" y="252" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600">GTO v2 陪练与复盘引擎</text>
  <text x="438" y="268" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">169 翻前矩阵 · Nash 推弃 · 蒙特卡洛胜率 · MDF</text>

  <rect x="424" y="288" width="276" height="44" rx="8" fill="#101618" stroke="#1F2B27"/>
  <text x="438" y="308" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600">安全鉴权与限流网关</text>
  <text x="438" y="324" fill="#8B9892" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">6 位邮箱 OTP · HMAC 会话 · X-Seat-Secret 校验</text>

  <text x="562" y="362" text-anchor="middle" fill="#6F7D77" font-family="ui-monospace, Consolas, monospace" font-size="11">Express · ws · 92 Unit Tests</text>

  <!-- Connector 2 -> 3 -->
  <line x1="728" y1="198" x2="782" y2="198" stroke="#3AA778" stroke-opacity="0.75" stroke-width="1.5" marker-end="url(#arrowGreen)" marker-start="url(#arrowGreen)"/>
  <text x="755" y="187" text-anchor="middle" fill="#7CE0B3" font-family="ui-monospace, Consolas, monospace" font-size="10">WAL</text>
  <line x1="728" y1="308" x2="782" y2="308" stroke="#D4A853" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowGold)"/>
  <text x="755" y="297" text-anchor="middle" fill="#D4A853" font-family="ui-monospace, Consolas, monospace" font-size="10">可选</text>

  <!-- Column 3: Storage & Optional Integrations -->
  <rect x="790" y="98" width="290" height="148" rx="14" fill="url(#cardFill)" stroke="#24302C" stroke-width="1.2"/>
  <rect x="790" y="98" width="290" height="3" rx="1.5" fill="#2E5C6E"/>
  <text x="814" y="128" fill="#7BB8CC" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">03 · PERSISTENCE</text>
  <text x="814" y="152" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600">原生 SQLite (WAL)</text>
  <text x="814" y="180" fill="#9AA7A1" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">· 玩家档案、段位与 30 枚勋章记录</text>
  <text x="814" y="201" fill="#9AA7A1" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">· 排行榜与陪练局归一化统计</text>
  <text x="814" y="222" fill="#9AA7A1" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">· 脱敏 hand_history 手牌回放</text>

  <rect x="790" y="262" width="290" height="116" rx="14" fill="url(#cardFill)" stroke="#24302C" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="814" y="292" fill="#D4A853" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2">04 · OPTIONAL</text>
  <text x="814" y="316" fill="#F4EFE6" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600">非强制外部扩展</text>
  <text x="814" y="342" fill="#9AA7A1" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">· DeepSeek API：陪练闲聊接梗与 GTO 点评</text>
  <text x="814" y="362" fill="#9AA7A1" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">· SMTP / Resend：真实邮箱验证码发信</text>
